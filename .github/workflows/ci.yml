name: Go CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  vimline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nvim for vimline oracle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/nvim"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"
      - name: Pinned vimline drift gate
        run: |
          vimline_version="$(go list -m -f '{{.Version}}' github.com/RooseveltAdvisors/vimline)"
          printf '%s\n' "$vimline_version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -z "$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/RooseveltAdvisors/vimline)"
          go test -count=1 github.com/RooseveltAdvisors/vimline github.com/RooseveltAdvisors/vimline/duration github.com/RooseveltAdvisors/vimline/keys
