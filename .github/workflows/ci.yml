name: Go CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  vimline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pinned vimline drift gate
        run: |
          vimline_version="$(go list -m -f '{{.Version}}' github.com/RooseveltAdvisors/vimline)"
          printf '%s\n' "$vimline_version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -z "$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/RooseveltAdvisors/vimline)"
          go test -count=1 github.com/RooseveltAdvisors/vimline github.com/RooseveltAdvisors/vimline/duration github.com/RooseveltAdvisors/vimline/keys
